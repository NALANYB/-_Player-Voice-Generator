<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色语音生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #0a0a0a;
            --white: #f5f5f5;
            --gray-dark: #1a1a1a;
            --gray-mid: #2a2a2a;
            --gray-border: #4a4a4a;
            --font-mono: 'Courier New', monospace;
            --font-sans: 'Segoe UI', Arial, sans-serif;
        }
        body { background: var(--white); color: var(--black); font-family: var(--font-sans); height: 100vh; overflow: hidden; }
        .layout { height: 100vh; display: flex; }
        .sidebar { 
            width: 140px; 
            background: var(--black); 
            padding: 16px 8px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            overflow-y: auto;
        }
        .sidebar-title { 
            color: #888; 
            font-size: 11px; 
            text-align: center; 
            padding: 8px 0; 
            letter-spacing: 1px; 
        }
        .mode-btn {
            width: 120px; 
            height: 100px;
            background: var(--gray-dark);
            border: 2px solid var(--gray-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .mode-btn:hover { 
            border-color: #666;
            background: #252525;
        }
        .mode-btn.active {
            border-color: #fff;
            background: #fff;
        }
        .mode-btn.active .mode-label {
            color: #000;
        }
        .mode-btn.active img {
            filter: none;
        }
        .mode-icon {
            width: 60px;
            height: 60px;
            object-fit: contain;
            filter: grayscale(1) brightness(0.8);
        }
        .mode-label {
            color: #888;
            font-size: 10px;
            text-align: center;
            font-family: var(--font-mono);
        }
        .main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 24px; 
            gap: 20px; 
            overflow: hidden; 
            background: var(--white);
        }
        .header { 
            display: flex; 
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-border);
        }
        .header h1 { 
            font-size: 20px; 
            font-weight: 600; 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lang-switcher {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .lang-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.15s;
        }
        .lang-btn:hover {
            background: var(--gray-dark);
        }
        .lang-btn.active {
            background: var(--gray-dark);
        }
        .lang-flag {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            transition: border-color 0.15s;
        }
        .lang-flag.zh-flag {
            object-position: center left;
        }
        .lang-flag.en-flag {
            object-position: center center;
        }
        .lang-btn.active .lang-flag {
            border-color: var(--white);
        }
        .lang-label {
            font-size: 10px;
            color: #888;
            font-family: var(--font-mono);
        }
        .lang-btn.active .lang-label {
            color: var(--white);
        }
        .header-icon {
            width: 24px;
            height: 24px;
            opacity: 0.6;
        }
        .header-actions {
            display: flex;
            gap: 12px;
        }
        .header-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            padding: 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .header-btn:hover {
            background: var(--gray-dark);
            color: var(--white);
        }
        .header-btn svg {
            width: 18px;
            height: 18px;
        }
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow: hidden;
        }
        .text-panel {
            background: #fafafa;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .text-panel-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            flex: 1;
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: 4px;
            color: var(--black);
            font-family: var(--font-sans);
            font-size: 15px;
            padding: 12px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }
        textarea:focus { 
            border-color: #666; 
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            padding-top: 12px;
        }
        .btn {
            padding: 12px 20px;
            background: var(--black);
            color: var(--white);
            border: 1px solid var(--black);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            height: 44px;
        }
        .btn:hover:not(:disabled) {
            background: #333;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn svg {
            width: 18px;
            height: 18px;
        }
        .btn-play {
            background: var(--black);
        }
        .btn-stop {
            background: var(--white);
            color: var(--black);
        }
        .btn-clear {
            background: var(--white);
            color: var(--black);
        }
        .btn-download {
            background: var(--white);
            color: var(--black);
        }
        .status { 
            font-size: 11px; 
            color: #888; 
            margin-left: auto;
            font-family: var(--font-mono);
        }
    </style>
</head>

        };
        Object.keys(newVersionAudio).forEach(k => newVersionAudio[k].preload = 'auto');

        
        let currentMode = 'old';
        let isPlaying = false;
        let currentTimeout = null;
        
        // 模式切换
        document.getElementById('oldModeBtn').addEventListener('click', () => {
            currentMode = 'old';
            document.getElementById('oldModeBtn').classList.add('active');
            document.getElementById('newModeBtn').classList.remove('active');
            updateStatus('已切换到老版本');
        });
        
        document.getElementById('newModeBtn').addEventListener('click', () => {
            currentMode = 'new';
            document.getElementById('newModeBtn').classList.add('active');
            document.getElementById('oldModeBtn').classList.remove('active');
            updateStatus('已切换到新版本');
        });
        
        // 字母发音近似映射（用现有音频模拟缺失的发音）
        const LETTER_ALIAS_MAP = {
            'B': 'D', 'C': 'S', 'D': 'I', 'G': 'D',
            'J': 'E', 'K': 'C', 'P': 'B', 'Q': 'U',
            'S': 'E', 'T': 'D', 'U': 'Y', 'V': 'E',
            'X': 'S'
        };
        
        // 逐个播放字母音频
        function speakLetter(letter) {
            const upper = letter.toUpperCase();
            
            if (newVersionAudio[upper]) {
                newVersionAudio[upper].currentTime = 0;
                const playPromise = newVersionAudio[upper].play();
                if (playPromise !== undefined) {
                    playPromise.catch(err => {
                        console.error(`播放 ${upper} 失败:`, err);
                    });
                }
            } else {
                speakLetterWithBrowser(upper);
            }
        }
        
        function speakLetterWithBrowser(letter) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            speechSynthesis.speak(utterance);
        }
        
        // 完整中文转拼音词库
        const CN_PINYIN_MAP = {
            '我':'wo','你':'ni','他':'ta','她':'ta','它':'ta',
            '是':'shi','有':'you','在':'zai','去':'qu','来':'lai',
            '做':'zuo','看':'kan','听':'ting','说':'shuo',
            '好':'hao','大':'da','小':'xiao','多':'duo','少':'shao',
            '人':'ren','天':'tian','地':'di','水':'shui','火':'huo',
            '花':'hua','草':'cao','树':'shu','山':'shan','月':'yue',
            '日':'ri','星':'xing','风':'feng','雨':'yu','雪':'xue',
            '金':'jin','木':'mu','土':'tu','石':'shi','铁':'tie',
            '爸':'ba','妈':'ma','爷':'ye','奶':'nai',
            '哥':'ge','姐':'jie','弟':'di','妹':'mei',
            '朋友':'peng you','老师':'lao shi','学生':'xue sheng',
            '今天':'jin tian','明天':'ming tian','昨天':'zuo tian',
            '早上':'zao shang','中午':'zhong wu','晚上':'wan shang',
            '现在':'xian zai','刚才':'gang cai','以后':'yi hou',
            '快乐':'kuai le','幸福':'xing fu','开心':'kai xin',
            '喜欢':'xi huan','爱':'ai','恨':'hen',
            '吃':'chi','喝':'he','走':'zou','跑':'pao',
            '来':'lai','去':'qu','回':'hui','到':'dao',
            '想':'xiang','知':'zhi','道':'dao',
            '一':'yi','二':'er','三':'san','四':'si','五':'wu',
            '六':'liu','七':'qi','八':'ba','九':'jiu','十':'shi',
            '百':'bai','千':'qian','万':'wan',
            '红':'hong','黄':'huang','蓝':'lan','绿':'lv',
            '黑':'hei','白':'bai','灰':'hui',
            '上':'shang','下':'xia','左':'zuo','右':'you',
            '前':'qian','后':'hou','内':'nei','外':'wai',
            '东':'dong','西':'xi','南':'nan','北':'bei',
        };
        
        // 中文转拼音函数
        function chineseToPinyin(text) {
            let result = '';
            let i = 0;
            
            while (i < text.length) {
                const char = text[i];
                
                if (/[a-zA-Z]/.test(char)) {
                    result += char;
                    i++;
                    continue;
                }
                
                if (char === ' ') {
                    result += ' ';
                    i++;
                    continue;
                }
                
                if (/[\u4e00-\u9fff]/.test(char)) {
                    if (CN_PINYIN_MAP[char]) {
                        result += CN_PINYIN_MAP[char] + ' ';
                        i++;
                        continue;
                    }
                    
                    if (i + 1 < text.length && /[\u4e00-\u9fff]/.test(text[i + 1])) {
                        const twoChar = text.substring(i, i + 2);
                        if (CN_PINYIN_MAP[twoChar]) {
                            result += CN_PINYIN_MAP[twoChar] + ' ';
                            i += 2;
                            continue;
                        }
                    }
                    
                    result += char;
                    i++;
                    continue;
                }
                
                i++;
            }
            
            return result.trim();
        }
        
        function hasChinese(text) {
            return /[\u4e00-\u9fff]/.test(text);
        }
        
        // 播放控制
        const speakBtn = document.getElementById('speakBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const textInput = document.getElementById('textInput');
        const status = document.getElementById('status');
        
        speakBtn.addEventListener('click', () => {
            if (isPlaying) return;
            const text = textInput.value.trim();
            if (!text) {
                updateStatus('请输入文本');
                return;
            }
            console.log('输入文本:', text);
            
            let playText = text;
            if (hasChinese(text) && currentMode === 'new') {
                updateStatus('转换中...');
                playText = chineseToPinyin(text);
                console.log('转换后拼音:', playText);
                updateStatus('播放中...');
            } else {
                updateStatus('播放中...');
            }
            
            playWord(playText);
        });
        
        stopBtn.addEventListener('click', stopSpeaking);
        
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            updateStatus('已清空');
        });
        
        const LETTER_PAUSE = 50;
        const SPACE_PAUSE = 200;
        
        function playWord(word) {
            if (isPlaying) stopSpeaking();
            isPlaying = true;
            updateStatus('播放中...');
            speakBtn.disabled = true;
            stopBtn.disabled = false;
            
            const isPureLetters = /^[A-Za-z]+$/.test(word);
            
            if (currentMode === 'old') {
                let i = 0;
                function playNext() {
                    if (i >= word.length || !isPlaying) {
                        isPlaying = false;
                        voiceAudio.pause();
                        voiceAudio.currentTime = 0;
                        speakBtn.disabled = false;
                        stopBtn.disabled = true;
                        updateStatus('已停止');
                        return;
                    }
                    const char = word[i];
                    if (char !== ' ') {
                        voiceAudio.currentTime = 0;
                        voiceAudio.play().catch(e => console.error('音频播放失败:', e));
                        currentTimeout = setTimeout(playNext, 100);
                    } else {
                        currentTimeout = setTimeout(playNext, 5);
                    }
                    i++;
                }
                playNext();
            } else if (isPureLetters) {
                let i = 0;
                function playNext() {
                    if (i >= word.length || !isPlaying) {
                        isPlaying = false;
                        speakBtn.disabled = false;
                        stopBtn.disabled = true;
                        updateStatus('已停止');
                        return;
                    }
                    speakLetter(word[i]);
                    i++;
                    currentTimeout = setTimeout(playNext, LETTER_PAUSE);
                }
                playNext();
            } else if (hasChinese(word)) {
                const pinyin = chineseToPinyin(word);
                console.log('拼音:', pinyin);
                playWord(pinyin);
            } else {
                const words = word.split(' ');
                let wordIndex = 0;
                
                function playNextWord() {
                    if (wordIndex >= words.length || !isPlaying) {
                        isPlaying = false;
                        speakBtn.disabled = false;
                        stopBtn.disabled = true;
                        updateStatus('已停止');
                        return;
                    }
                    const w = words[wordIndex].toUpperCase();
                    let charIndex = 0;
                    function playNextChar() {
                        if (charIndex >= w.length || !isPlaying) {
                            charIndex = 0;
                            wordIndex++;
                            currentTimeout = setTimeout(playNextWord, SPACE_PAUSE);
                            return;
                        }
                        speakLetter(w[charIndex]);
                        charIndex++;
                        currentTimeout = setTimeout(playNextChar, LETTER_PAUSE);
                    }
                    playNextChar();
                }
                playNextWord();
            }
        }
        
        function stopSpeaking() {
            isPlaying = false;
            if (currentTimeout) {
                clearTimeout(currentTimeout);
                currentTimeout = null;
            }
            voiceAudio.pause();
            voiceAudio.currentTime = 0;
            window.speechSynthesis.cancel();
            speakBtn.disabled = false;
            stopBtn.disabled = true;
            updateStatus('已停止');
        }
        
        // 语言切换
        let currentLang = 'zh';
        const i18n = {
            zh: {
                title: '玩家语音生成器',
                placeholder: '请输入英文文本或中文...',
                inputLabel: '输入文本',

                statusInput: '请输入文本',

                modeNew: '新版本语音',
                switchOld: '已切换到老版本',
                switchNew: '已切换到新版本',
                clear: '已清空'

            en: {
                title: 'Player Voice Generator',
                placeholder: 'Enter English text or Chinese...',
                inputLabel: 'Input Text',
                speak: 'Play',
                stop: 'Stop',
                clear: 'Clear',
                download: '',
                statusReady: 'Ready',
                statusPlaying: 'Playing...',
                statusStopped: 'Stopped',
                statusConverting: 'Converting...',
                statusDownloading: 'Downloading...',
                statusDownload: 'Downloaded',
                statusInput: 'Please enter text',
                modeOld: 'Old Voice',
                modeNew: 'New Voice',
                switchOld: 'Switched to old version',
                switchNew: 'Switched to new version',
                clear: 'Cleared'
            }
        };
        
        document.getElementById('zhBtn').addEventListener('click', () => {
            currentLang = 'zh';
            document.getElementById('zhBtn').classList.add('active');
            document.getElementById('enBtn').classList.remove('active');
            updateUI();
        });
        
        document.getElementById('enBtn').addEventListener('click', () => {
            currentLang = 'en';
            document.getElementById('enBtn').classList.add('active');
            document.getElementById('zhBtn').classList.remove('active');
            updateUI();
        });
        
        function updateUI() {
            const t = i18n[currentLang];
            document.querySelector('h1 span').textContent = t.title;
            textInput.placeholder = t.placeholder;
            document.getElementById('panelLabel').textContent = t.inputLabel;
            document.getElementById('oldModeLabel').textContent = t.modeOld;
            document.getElementById('newModeLabel').textContent = t.modeNew;
            speakBtn.title = t.speak;
            stopBtn.title = t.stop;
            clearBtn.title = t.clear;
            updateStatus(t.statusReady);
        }
        
        function updateStatus(msg) {
            const t = i18n[currentLang];
            const statusMap = {
                '播放中...': t.statusPlaying,
                '已停止': t.statusStopped,
                '转换中...': t.statusConverting,
                '下载中...': t.statusDownloading,
                '已下载': t.statusDownload,
                '请输入文本': t.statusInput,
                '已切换到老版本': t.switchOld,
                '已切换到新版本': t.switchNew,
                '已清空': t.clear
            };
            status.textContent = statusMap[msg] || msg;
        }
        
        // 快捷键
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                speakBtn.click();
            } else if (e.key === 'Escape') {
                stopSpeaking();
            }
        });
    </script>
